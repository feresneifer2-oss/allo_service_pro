# Sane defaults that build on any machine (laptop / CI runner), including
# low-RAM ones. Gradle reuses the daemon only when these args match.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# NOTE: no `org.gradle.java.home` here - the JDK is resolved portably at
# runtime (flutter config --jdk-dir -> Android Studio bundled JDK -> JAVA_HOME),
# so the build works on any machine / CI runner without machine-specific paths.
