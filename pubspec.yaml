name: allo_service_pro
description: "Allo Service - Plateforme premium de services professionnels en Tunisie."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^7.3.1
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^5.2.1
  crypto: ^3.0.3
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  record: ^7.1.1
  audioplayers: ^6.1.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  onesignal_flutter: ^5.3.0




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Supabase configuration resolution (CodeRabbit): `.env` is gitignored and
  # NOT bundled as an asset anymore — main.dart resolves the credentials via
  # dotenv (local dev) or `--dart-define=SUPABASE_URL/SUPABASE_ANON_KEY`
  # (release/CI), degrading gracefully to LOCAL-ONLY mode when neither is
  # present. Never re-add `.env` here: it would break fresh-clone builds.
  assets:
    - assets/images/
    - assets/services/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
